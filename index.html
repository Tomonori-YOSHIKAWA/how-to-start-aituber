<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AITuberのつくりかた サンプルアプリ</title>

  <!-- settings.jsをモジュールとしてインポート -->
  <script type="module">
    import { DEFAULT_SETTINGS } from './settings.js';
    window.DEFAULT_SETTINGS = DEFAULT_SETTINGS;  // グローバルスコープで利用できるようにする
  </script>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #status, #error-message {
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      margin-bottom: 20px;
    }
    #error-message {
      display: none;
      background: #fff0f0;
      border-color: #ffcdd2;
      color: #d32f2f;
    }
    #error-details {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .error #error-details {
      display: block;
    }
    .settings {
      background: #fff;
      padding: 20px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
    }
    .settings h3 {
      margin: 15px 0 5px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
    }
    .settings textarea {
      width: 100%;
      min-height: 100px;
      padding: 5px;
      margin: 5px 0;
      font-family: sans-serif;
    }
    .settings-group {
      margin-bottom: 20px;
    }
    .controls {
      margin: 20px 0;
    }
    .controls button {
      padding: 10px 20px;
      margin-right: 10px;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    #conversation-history {
      background: #fff;
      padding: 20px;
      border: 1px solid #ddd;
      margin-top: 20px;
      flex-grow: 1;
      overflow-y: auto;
      min-height: 300px;
      height: calc(100vh - 600px);
    }
    
    .conversation-item {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    
    .user-message {
      color: #2196F3;
      margin-bottom: 5px;
    }
    
    .assistant-response {
      color: #4CAF50;
    }
    
    .settings-header {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    
    .settings-header h2 {
      margin: 0;
    }
    
    .settings-toggle {
      margin-left: auto;
      padding: 5px;
      font-size: 20px;
      transition: transform 0.3s;
    }
    
    .settings-content {
      transition: max-height 0.3s ease-out;
      overflow: hidden;
      max-height: 2000px; /* 十分大きな値 */
    }
    
    .settings-content.collapsed {
      max-height: 0;
    }
    
    /* 矢印の回転 */
    .settings-toggle.collapsed {
      transform: rotate(-90deg);
    }
    .status-text {
      margin-top: 5px;
      padding: 5px;
      border-radius: 3px;
    }
    .status-text.connected {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .status-text.disconnected {
      background-color: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>

  <!-- Difyテスト用UI -->

    <div class="settings-header">
      <h2>Difyボット テスト</h2>
    </div>
    <div class="settings-content">

        <input type="text" id="testMessage" placeholder="ここにメッセージを入力してください">

      <h2>会話履歴 (<span id="conversation-count">0</span>/<span id="conversation-max">0</span>件)</h2>

  <script>
    // グローバル変数の初期化を最初に行う
    const statusDiv = document.getElementById('status');
    let isProcessing = false;
    let shouldContinue = false;
    let processedMessageIds = new Map();
    let conversationHistory = [];

    // VTubeStudio WebSocket接続の管理
    let vtsWebSocket = null;
    let vtsAuthenticated = false;
    const VTS_WEBSOCKET_URL = 'ws://localhost:';

    // 初期値を設定
    function initializeSettings() {
      // DEFAULT_SETTINGSが利用できない場合のフォールバック値
      const defaultValues = {
        YOUTUBE_API_KEY: '',
        VIDEO_ID: '',
        WAIT_TIME: 10,
        DIFY_API_KEY: 'app-TbCNFXf0eIQzbMgoh7JSqIxs',
        DIFY_API_ENDPOINT: 'http://172.188.120.18/v1',
        VOICEVOX_ENDPOINT: 'http://localhost:50021',
        VOICEVOX_SPEAKER: 2,
        CONVERSATION_HISTORY_SIZE: 10,
        VTS_PORT: '8001'
      };

      // DEFAULT_SETTINGSが利用可能な場合はそれを使用、そうでなければフォールバック値を使用
      const settings = (typeof DEFAULT_SETTINGS !== 'undefined') ? DEFAULT_SETTINGS : defaultValues;

      document.getElementById('youtubeApiKey').value = settings.YOUTUBE_API_KEY;
      document.getElementById('videoId').value = settings.VIDEO_ID;
      document.getElementById('waitTime').value = settings.WAIT_TIME;
      document.getElementById('difyApiKey').value = settings.DIFY_API_KEY;
      document.getElementById('difyEndpoint').value = settings.DIFY_API_ENDPOINT;
      document.getElementById('difyInputVariable').value = settings.DIFY_INPUT_VARIABLE || 'query';
      document.getElementById('voicevoxEndpoint').value = settings.VOICEVOX_ENDPOINT;
      document.getElementById('voicevoxSpeaker').value = settings.VOICEVOX_SPEAKER;
      document.getElementById('conversationHistorySize').value = settings.CONVERSATION_HISTORY_SIZE;
      document.getElementById('vtsPort').value = settings.VTS_PORT || '8001';
      updateVTSStatus();
    }

    // DOMContentLoadedイベントで初期化を行う
    document.addEventListener('DOMContentLoaded', () => {
      initializeSettings();
      updateConversationDisplay();
      
      // VTubeStudioに接続
      // connectToVTS();
      
      // イベントリスナーの設定
      document.getElementById('startButton').addEventListener('click', () => {
        if (isProcessing) return;
        
        // 設定値の検証
        const settings = getSettings();
        if (!settings.YOUTUBE_API_KEY) {
          showError("YouTube API Keyが設定されていません");
          return;
        }
        if (!settings.VIDEO_ID) {
          showError("配信IDが設定されていません");
          return;
        }
        if (!settings.DIFY_API_KEY) {
          showError("Dify API Keyが設定されていません");
          return;
        }
        
        clearError();
        shouldContinue = true;
        isProcessing = true;
        processedMessageIds.clear();
        updateButtonState(true);
        console.log("処理を開始します"); // デバッグログ追加
        processNextComment();
      });

      document.getElementById('stopButton').addEventListener('click', () => {
        shouldContinue = false;
        isProcessing = false;
        updateButtonState(false);
        statusDiv.innerText = "停止しました";
        conversationHistory = [];
        updateConversationDisplay();
      });

      // Difyテストボタンのイベントリスナー
      document.getElementById('testDifyButton').addEventListener('click', async () => {
        const testMessage = document.getElementById('testMessage').value;
        const responseDiv = document.getElementById('testResponse');
        
        console.log('Difyテストボタンがクリックされました');
        console.log('入力メッセージ:', testMessage);
        
        if (!testMessage.trim()) {
          responseDiv.textContent = 'メッセージを入力してください';
          return;
        }

        try {
          responseDiv.textContent = 'Difyに問い合わせ中...';
          console.log('getDifyResponse呼び出し開始');
          const response = await getDifyResponse(testMessage);
          console.log('getDifyResponse応答:', response);
          responseDiv.textContent = response;
        } catch (error) {
          console.error('Difyテストエラー:', error);
          responseDiv.textContent = 'エラーが発生しました: ' + error.message;
        }
      });

      // Enterキーでテスト実行
      document.getElementById('testMessage').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('testDifyButton').click();
        }
      });
    });

    // 設定値を取得する関数を修正
    function getSettings() {
      // DEFAULT_SETTINGSが利用できない場合のフォールバック値
      const defaultValues = {
        MESSAGE_LIFETIME: 300,
        VTS_PORT: '8001'
      };
      
      return {
        YOUTUBE_API_KEY: document.getElementById('youtubeApiKey').value,
        VIDEO_ID: document.getElementById('videoId').value,
        DIFY_API_KEY: document.getElementById('difyApiKey').value,
        DIFY_API_ENDPOINT: document.getElementById('difyEndpoint').value,
        DIFY_INPUT_VARIABLE: document.getElementById('difyInputVariable').value || 'query',
        VOICEVOX_ENDPOINT: document.getElementById('voicevoxEndpoint').value,
        VOICEVOX_SPEAKER: parseInt(document.getElementById('voicevoxSpeaker').value),
        WAIT_TIME: parseInt(document.getElementById('waitTime').value),
        MESSAGE_LIFETIME: (typeof DEFAULT_SETTINGS !== 'undefined') ? DEFAULT_SETTINGS.MESSAGE_LIFETIME : defaultValues.MESSAGE_LIFETIME,
        CONVERSATION_HISTORY_SIZE: parseInt(document.getElementById('conversationHistorySize').value),
        VTS_PORT: document.getElementById('vtsPort').value || defaultValues.VTS_PORT
      };
    }

    // ボタンの状態を更新する関数
    function updateButtonState(isRunning) {
      document.getElementById('startButton').disabled = isRunning;
      document.getElementById('stopButton').disabled = !isRunning;
    }

    // エラー表示用の関数を修正
    function showError(message, details = '') {
      const errorMessageDiv = document.getElementById('error-message');
      const errorDetailsDiv = document.getElementById('error-details');
      
      errorMessageDiv.style.display = 'block';
      errorMessageDiv.textContent = message;
      
      if (details) {
        errorDetailsDiv.style.display = 'block';
        errorDetailsDiv.textContent = details;
      } else {
        errorDetailsDiv.style.display = 'none';
      }
    }

    // エラー表示をクリアする関数を修正
    function clearError() {
      const errorMessageDiv = document.getElementById('error-message');
      const errorDetailsDiv = document.getElementById('error-details');
      
      errorMessageDiv.style.display = 'none';
      errorDetailsDiv.style.display = 'none';
    }

    // 期限切れのメッセージIDを削除する関数
    function cleanupProcessedMessages() {
      const settings = getSettings();
      const now = Date.now();
      const expiryTime = settings.MESSAGE_LIFETIME * 1000; // 秒をミリ秒に変換
      
      for (const [id, timestamp] of processedMessageIds) {
        if (now - timestamp > expiryTime) {
          processedMessageIds.delete(id);
        }
      }
    }

    // Youtubeからライブチャットを取得する関数
    async function fetchYoutubeLiveChat() {
      const settings = getSettings();
      statusDiv.innerText = "YouTubeライブチャットを取得中...";
      clearError();
      
      console.log("YouTube API呼び出し開始"); // デバッグログ追加
      
      try {
        // まずライブチャットIDを取得
        const videoUrl = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${settings.VIDEO_ID}&key=${settings.YOUTUBE_API_KEY}`;
        console.log("動画情報取得URL:", videoUrl); // デバッグログ追加
        
        const videoResponse = await fetch(videoUrl);
        
        if (!videoResponse.ok) {
          const errorText = await videoResponse.text();
          console.error("YouTube API エラー:", errorText); // デバッグログ追加
          let errorMessage = `YouTube API エラー (${videoResponse.status})`;
          if (videoResponse.status === 403) {
            errorMessage = 'YouTube API キーが無効か、アクセス権限がありません';
          } else if (videoResponse.status === 404) {
            errorMessage = '指定された動画が見つかりません';
          }
          showError(errorMessage, errorText);
          return [];
        }

        const videoData = await videoResponse.json();
        console.log("取得した動画データ:", videoData); // デバッグログ追加
        
        if (!videoData.items?.[0]?.liveStreamingDetails?.activeLiveChatId) {
          showError('この動画はライブ配信ではないか、ライブチャットが無効になっています');
          return [];
        }

        const liveChatId = videoData.items[0].liveStreamingDetails.activeLiveChatId;
        
        // ライブチャットメッセージを取得
        const chatUrl = `https://www.googleapis.com/youtube/v3/liveChat/messages?part=snippet&liveChatId=${liveChatId}&key=${settings.YOUTUBE_API_KEY}`;
        const chatResponse = await fetch(chatUrl);
        
        if (!chatResponse.ok) {
          const errorText = await chatResponse.text();
          showError(
            'ライブチャットの取得に失敗しました',
            errorText
          );
          return [];
        }

        const chatData = await chatResponse.json();
        return chatData.items || [];

      } catch (error) {
        showError(
          'YouTube APIの呼び出しに失敗しました。',
          error.toString()
        );
        return [];
      }
    }

    // シンプルなランダム選択関数（Dify呼び出しを回避）
    async function selectBestComment(messages) {
      // Difyでの複雑な選択処理を回避し、シンプルにランダム選択
      console.log('コメント選択はランダム選択を使用します');
      return null; // nullを返すことでランダム選択にフォールバック
    }

    // 取得したチャットメッセージから最適なものを選ぶ関数を修正
    async function pickRandomChat(messages) {
      if (!messages || messages.length === 0) return null;
      
      // 期限切れのメッセージを削除
      cleanupProcessedMessages();
      
      // 未処理のメッセージをフィルタリング
      const unprocessedMessages = messages.filter(msg => !processedMessageIds.has(msg.id));
      
      if (unprocessedMessages.length === 0) return null;

      // すべてのメッセージを処理済みとしてマーク
      messages.forEach(msg => {
        processedMessageIds.set(msg.id, Date.now());
      });

      // OpenAIを使って最適なコメントを選択
      const selectedId = await selectBestComment(unprocessedMessages);
      let selectedMessage;

      if (selectedId) {
        selectedMessage = unprocessedMessages.find(msg => msg.id === selectedId);
      }

      // OpenAIでの選択に失敗した場合はランダムに選択
      if (!selectedMessage) {
        const randomIndex = Math.floor(Math.random() * unprocessedMessages.length);
        selectedMessage = unprocessedMessages[randomIndex];
      }
      
      return selectedMessage.snippet.displayMessage;
    }

    // Dify APIを呼び出す関数を修正
    async function getDifyResponse(commentText) {
      const settings = getSettings();
      statusDiv.innerText = "Difyに問い合わせ中...";
      clearError();

      try {
        console.log('Dify API呼び出し開始:', {
          endpoint: settings.DIFY_API_ENDPOINT,
          comment: commentText
        });

        // まずChat APIを試行
        let response = await fetch(`${settings.DIFY_API_ENDPOINT}/chat-messages`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${settings.DIFY_API_KEY}`
          },
          body: JSON.stringify({
            inputs: {},
            query: commentText,
            response_mode: "blocking",
            user: `user-${Date.now()}`,
            conversation_id: ""
          })
        });
        
        console.log('Chat API応答ステータス:', response.status);
        
        // Chat APIが失敗した場合、他のAPIを試行
        if (response.status === 400) {
          const errorData = await response.json();
          if (errorData.code === 'not_chat_app' || errorData.code === 'app_unavailable') {
            console.log('Chat APIではないため、Completion APIを使用');
            
            response = await fetch(`${settings.DIFY_API_ENDPOINT}/completion-messages`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${settings.DIFY_API_KEY}`
              },
              body: JSON.stringify({
                inputs: {},
                query: commentText,
                response_mode: "blocking",
                user: `user-${Date.now()}`
              })
            });
            
            console.log('Completion API応答ステータス:', response.status);

                console.log('Completion APIでもないため、Workflow APIを使用');
                
                response = await fetch(`${settings.DIFY_API_ENDPOINT}/workflows/run`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${settings.DIFY_API_KEY}`

                  })
                });

          }

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Dify API エラー詳細:', errorText);
          let errorMessage = `Dify API エラー (${response.status})`;

            errorMessage = 'Dify APIの利用制限に達しました';
          }
          showError(errorMessage, errorText);
          return "申し訳ありませんが、エラーが発生しました。";

        const data = await response.json();
        console.log('=== Dify API応答データ（完全版） ===');

        console.log('=== トップレベルのキー ===', Object.keys(data));

            JSON.stringify(data.error, null, 2)

          return "申し訳ありませんが、エラーが発生しました。";
        }

        // Workflowのエラーをチェック
        if (data.data && data.data.status === 'failed' && data.data.error) {
          console.error('Dify Workflow エラー:', data.data.error);
          showError(
            'Dify Workflowの実行に失敗しました。',

          );
          return "申し訳ありませんが、エラーが発生しました。";
        }

        // レスポンスから適切なフィールドを取得
        let assistantResponse = '';

        // より詳細なデバッグ情報を出力
        console.log('レスポンス解析開始...');
        console.log('data.answer:', data.answer);
        console.log('data.text:', data.text);
        console.log('data.data:', data.data);

        // data.dataの中身も詳細に表示
        if (data.data) {
          console.log('data.data の詳細:', JSON.stringify(data.data, null, 2));
          console.log('data.data のキー:', Object.keys(data.data));
        }

        if (data.answer) {
          // Completion API の場合
          console.log('→ Completion APIのレスポンスとして処理');
          assistantResponse = data.answer.trim();
        } else if (data.data) {
          // Workflow API の場合
          console.log('→ Workflow APIのレスポンスとして処理');

          // data.data.outputs をチェック
          if (data.data.outputs) {
            const outputs = data.data.outputs;
            console.log('outputs:', outputs);
            if (outputs.text) {
              assistantResponse = outputs.text.trim();
            } else if (outputs.answer) {
              assistantResponse = outputs.answer.trim();
            } else {
              // 最初の出力値を使用
              const firstKey = Object.keys(outputs)[0];
              console.log('最初の出力キー:', firstKey);
              assistantResponse = outputs[firstKey] ? String(outputs[firstKey]).trim() : '';
            }
          } else {
            // data.data直下のフィールドをチェック
            console.log('data.data.outputs がないため、data.data 直下を検索');
            if (data.data.text) {
              assistantResponse = data.data.text.trim();
            } else if (data.data.answer) {
              assistantResponse = data.data.answer.trim();
            } else {
              // data.data直下の文字列フィールドを探す
              for (const key of Object.keys(data.data)) {
                const value = data.data[key];
                if (typeof value === 'string' && value.trim().length > 0) {
                  console.log(`data.data.${key} に文字列発見: ${value}`);
                  assistantResponse = value.trim();
                  break;
                }
              }
            }
          }

          console.log('→ Chat APIのレスポンスとして処理');
          assistantResponse = data.text.trim();
        } else {
          // 他のパターンをチェック
          console.log('→ 標準パターンに該当せず、代替フィールドを検索');
          // data直下の文字列フィールドを探す
          for (const key of Object.keys(data)) {
            if (typeof data[key] === 'string' && data[key].trim().length > 0) {
              console.log(`文字列フィールド発見: ${key} = ${data[key]}`);
              assistantResponse = data[key].trim();
              break;
            }
          }
        }

        console.log('最終的な応答:', assistantResponse);
        console.log('応答の長さ:', assistantResponse.length);

        if (assistantResponse) {
          console.log('✓ Dify応答成功:', assistantResponse);
          
          // 会話履歴を更新
          if (settings.CONVERSATION_HISTORY_SIZE > 0) {
            conversationHistory.push({

            }

          }
          
          return assistantResponse;
        }

        console.error('✗ Dify API応答に適切なフィールドがありません');
        console.error('完全なレスポンス:', JSON.stringify(data, null, 2));
        console.error('利用可能なフィールド:', Object.keys(data));
        showError(
          'Dify APIからの応答が不正です。コンソールログで詳細を確認してください。',
          `応答フィールド: ${Object.keys(data).join(', ')}\n\n完全なレスポンス:\n${JSON.stringify(data, null, 2)}`
        );
        return "申し訳ありませんが、返答を生成できませんでした。";
      } catch (error) {
        console.error('Dify API呼び出し例外:', error);
        showError(
          'Dify APIの呼び出しに失敗しました。',
          error.toString()
        );
        return "申し訳ありませんが、エラーが発生しました。";
      }

    // VTubeStudioへの接続を確立
    async function connectToVTS() {
      const port = document.getElementById('vtsPort').value || '8001';
      try {
        if (vtsWebSocket) {
          vtsWebSocket.close();
        }
        vtsWebSocket = new WebSocket(`ws://localhost:${port}`);
        
        vtsWebSocket.onopen = () => {
          console.log('VTubeStudio WebSocketに接続しました');
          updateVTSStatus();
          // 認証プロセスを開始

        };
        
        vtsWebSocket.onclose = () => {

          vtsAuthenticated = false;
          updateVTSStatus();
        };
        
        vtsWebSocket.onerror = (error) => {
          console.error('VTubeStudio WebSocketエラー:', error);
          showError('VTubeStudioとの接続に失敗しました');
          updateVTSStatus();
        };
        
        vtsWebSocket.onmessage = handleVTSMessage;
      } catch (error) {
        console.error('VTubeStudio接続エラー:', error);
        showError('VTubeStudioとの接続に失敗しました');
        vtsWebSocket = null;
        updateVTSStatus();
      }
    }

    // 保存されたトークンで認証
    function sendVTSAuthRequest(token) {
      const authRequest = {
        apiName: "VTubeStudioPublicAPI",
        apiVersion: "1.0",
        requestID: "12345",
        messageType: "AuthenticationRequest",
        data: {

    // VTSからのメッセージを処理
    function handleVTSMessage(event) {
      try {
        const message = JSON.parse(event.data);
        console.log('VTS応答受信:', message);
        
        if (message.messageType === 'AuthenticationTokenResponse') {
          // 認証トークンを保存
          const token = message.data.authenticationToken;
          console.log('認証トークン受信:', token);
          localStorage.setItem('vtsAuthenticationToken', token);
          sendVTSAuthRequest(token);
        
        } else if (message.messageType === 'AuthenticationResponse') {
          if (message.data.authenticated) {
            console.log('VTubeStudio認証成功');
            vtsAuthenticated = true;
            updateVTSStatus();
            requestModelList();
          } else {
            console.log('VTubeStudio認証失敗');
            showError('VTubeStudioの認証に失敗しました');
            vtsAuthenticated = false;
            updateVTSStatus();
          }
        } else if (message.messageType === 'AvailableModelsResponse') {
          console.log('利用可能なモデル:', message.data.availableModels);
          
          const currentModel = message.data.availableModels.find(model => model.modelLoaded);
          if (currentModel) {
            console.log('現在のモデル:', currentModel);
            requestModelParameters(currentModel.modelID);
          }
        } else if (message.messageType === 'InputParameterListResponse') {
          console.log('パラメータ一覧を受信:', message.data);
          
          if (message.data && message.data.defaultParameters) {
            const parameters = message.data.defaultParameters;
            console.log('すべてのパラメータ名:', parameters.map(p => p.name));
            
            // 口の開きに関連するパラメータを検索
            const mouthParams = parameters
              .filter(param => {
                const name = param.name.toLowerCase();
                
                // 目に関連するパラメータを除外
                if (name.includes('eye') || name.includes('目')) {
                  return false;
                }

                // より厳密な口パラメータの検索条件
                const mouthPatterns = [
                  'mouth_open',      // 一般的な口開きパラメータ
                  'mouth.open',      // ドット区切り
                  'mouth_openness',  // 開度パラメータ
                  'parammouth',      // VTSの標準的な命名
                  'mouthopen',       // キャメルケース
                  '口開き',          // 日本語
                  '口の開き',        // 日本語バリエーション
                  'あ口',           // 母音Aの口形
                  'mouth_a',        // 母音A（英語）
                ];

                return mouthPatterns.some(pattern => name.includes(pattern));
              })
              .map(param => param.name);
            
            if (mouthParams.length === 0) {
              console.warn('口の開閉に関連するパラメータが見つかりませんでした。全パラメータ:', parameters.map(p => p.name));
            } else {
              console.log('使用する口パラメータ:', mouthParams);
            }
            
            // グローバル変数に保存
            window.vtsParameters = parameters;
          }
        }
      } catch (error) {
        console.error('メッセージ処理エラー:', error);
        showError('VTubeStudioからのメッセージ処理に失敗しました');
      }
    }

    // 音声生成とリップシンク制御を行う関数
    async function generateVoiceAndLipSync(text) {
      try {
        const settings = getSettings();
        console.log('音声生成開始:', text);

        // タイムアウト設定を追加（長い文章の音声合成に対応）
        const timeout = 60000; // 60秒
        
        // audio_queryリクエストにタイムアウトを設定
        const queryPromise = fetch(`${settings.VOICEVOX_ENDPOINT}/audio_query?text=${encodeURIComponent(text)}&speaker=${settings.VOICEVOX_SPEAKER}`, {
          method: 'POST',
          signal: AbortSignal.timeout(timeout)
        });
        
        console.log('audio_query リクエスト開始');
        const query = await queryPromise;
        if (!query.ok) {
          throw new Error(`audio_query failed: ${query.status} ${query.statusText}`);
        }
        const queryJson = await query.json();
        console.log('audio_query 完了');
        
        // synthesis リクエストにタイムアウトを設定
        const synthesisPromise = fetch(`${settings.VOICEVOX_ENDPOINT}/synthesis?speaker=${settings.VOICEVOX_SPEAKER}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(queryJson),
          signal: AbortSignal.timeout(timeout)
        });
        
        console.log('synthesis リクエスト開始');
        const synthesis = await synthesisPromise;
        if (!synthesis.ok) {
          throw new Error(`synthesis failed: ${synthesis.status} ${synthesis.statusText}`);
        }
        
        // 音声データを取得
        const audioData = await synthesis.arrayBuffer();
        console.log('音声データ取得完了:', audioData.byteLength, 'bytes');
        
        // 音声再生の準備
        const audioBlob = new Blob([audioData], { type: 'audio/wav' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        
        // 音声再生とリップシンク制御を同期
        return new Promise((resolve, reject) => {
          let lipSyncStarted = false;
          
          audio.onplay = () => {
            console.log('音声再生開始');
            if (!lipSyncStarted) {
              lipSyncStarted = true;
              // リップシンク制御を開始
              controlLipSync(audioData).catch(error => {
                console.error('リップシンク制御エラー:', error);
              });
            }
          };
          
          audio.onended = () => {
            console.log('音声再生完了');
            URL.revokeObjectURL(audioUrl);
            resolve();
          };
          
          audio.onerror = (error) => {
            console.error('音声再生エラー:', error);
            URL.revokeObjectURL(audioUrl);
            reject(error);
          };
          
          // 音声再生開始
          audio.play().catch(error => {
            console.error('音声再生開始エラー:', error);
            reject(error);
          });
        });
        
      } catch (error) {
        if (error.name === 'TimeoutError') {
          console.error('VOICEVOXリクエストがタイムアウトしました:', error);
          showError('音声生成がタイムアウトしました。VOICEVOXサーバーの状態を確認してください。');
        } else {
          console.error('音声生成エラー:', error);
          showError('音声の生成に失敗しました: ' + error.message);
        }
        throw error;
      }
    }

    // リップシンク制御の関数を修正
    async function controlLipSync(audioData) {
      if (!vtsAuthenticated || !vtsWebSocket) {
        throw new Error('VTubeStudioが接続されていません');
      }

      if (!window.vtsParameters) {
        throw new Error('モデルパラメータが取得できていません');
      }

      console.log('リップシンク制御開始');
      
      const audioContext = new AudioContext();
      const audioBuffer = await audioContext.decodeAudioData(audioData);
      const channelData = audioBuffer.getChannelData(0);
      
      const interval = 100; // 100ms間隔で更新
      const samplesPerInterval = Math.floor(audioBuffer.sampleRate * (interval / 1000));
      
      // 口の開きに関連するパラメータを取得
      const mouthParams = window.vtsParameters
        .filter(param => {
          const name = param.name.toLowerCase();
          
          // 目に関連するパラメータを除外
          if (name.includes('eye') || name.includes('目')) {
            return false;
          }

          // より厳密な口パラメータの検索条件
          const mouthPatterns = [
            'mouth_open',      // 一般的な口開きパラメータ
            'mouth.open',      // ドット区切り
            'mouth_openness',  // 開度パラメータ
            'parammouth',      // VTSの標準的な命名
            'mouthopen',       // キャメルケース
            '口開き',          // 日本語
            '口の開き',        // 日本語バリエーション
            'あ口',           // 母音Aの口形
            'mouth_a',        // 母音A（英語）
          ];

          return mouthPatterns.some(pattern => name.includes(pattern));
        })
        .map(param => param.name);
      
      // パラメータが見つからない場合は警告を表示
      if (mouthParams.length === 0) {
        console.warn('口の開閉に関連するパラメータが見つかりませんでした。以下の全パラメータ名を確認してください:');
        console.warn(window.vtsParameters.map(p => p.name));
      } else {
        console.log('使用する口パラメータ:', mouthParams);
      }
      
      // レスポンスハンドラを設定
      const originalOnMessage = vtsWebSocket.onmessage;
      const messageHandler = (event) => {
        if (originalOnMessage) {
          originalOnMessage(event);
        }
      };
      vtsWebSocket.onmessage = messageHandler;
      
      try {
        for (let i = 0; i < channelData.length; i += samplesPerInterval) {
          // 音量の計算
          let sum = 0;
          for (let j = 0; j < samplesPerInterval && (i + j) < channelData.length; j++) {
            sum += Math.abs(channelData[i + j]);
          }
          const volume = sum / samplesPerInterval;
          const mouthOpenValue = Math.min(Math.max(volume * 8, 0), 1);
          
          // パラメータ値を設定
          const parameterValues = mouthParams.map(param => ({
            id: param,
            value: mouthOpenValue,
            weight: 1
          }));
          
          const request = {
            apiName: "VTubeStudioPublicAPI",
            apiVersion: "1.0",
            requestID: `lipSync-${Date.now()}`,
            messageType: "InjectParameterDataRequest",
            data: { parameterValues }
          };
          
          vtsWebSocket.send(JSON.stringify(request));
          await new Promise(resolve => setTimeout(resolve, interval));
        }
      } finally {
        vtsWebSocket.onmessage = originalOnMessage;
        console.log('リップシンク制御完了');
      }
    }
  </script>
